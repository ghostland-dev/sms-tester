name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest
      - name: Run API tests
        run: pytest sms_api_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install
      - name: Run UI tests
        run: npm test -- --watchAll=false
      - name: Build UI
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        run: docker build -t sms-api .
      - name: Build UI Docker image
        run: docker build -t sms-ui ./sms-ui 