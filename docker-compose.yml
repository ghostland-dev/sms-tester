version: '3.8'

services:
  api:
    build: .
    container_name: sms-api
    ports:
      - "8888:8000"
    volumes:
      - ./sms_storage.json:/app/sms_storage.json
    restart: unless-stopped

  ui:
    build: ./sms-ui
    container_name: sms-ui
    ports:
      - "3333:80"
    depends_on:
      - api
    restart: unless-stopped 